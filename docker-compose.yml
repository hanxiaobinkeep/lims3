version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lims-mysql
    environment:
      MYSQL_ROOT_PASSWORD: lvba123456
      MYSQL_DATABASE: lims_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - lims-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lims-backend
    ports:
      - "3002:3002"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: lvba123456
      DB_NAME: lims_db
    networks:
      - lims-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lims-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lims-network

volumes:
  mysql-data:

networks:
  lims-network:
    driver: bridge
